name: job_app
description: "Application de recrutement pour petits jobs"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  # Networking
  dio: ^5.4.0

  # Auth / Storage
  flutter_secure_storage: ^9.2.2
  google_sign_in: ^6.2.1
  shared_preferences: ^2.2.2

  # File & media
  image_picker: ^1.0.7
  file_picker: ^8.0.0

  # Realtime
  web_socket_channel: ^3.0.1

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # UI / utilities
  font_awesome_flutter: ^10.7.0
  intl: ^0.19.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  riverpod_generator: ^2.4.0
  build_runner: ^2.4.9
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/